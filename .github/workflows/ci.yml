name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android build + JVM tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests (desktop JVM + Android)
        run: ./gradlew :composeApp:desktopTest :composeApp:testDebugUnitTest --console=plain
      - name: Build debug APK
        run: ./gradlew :composeApp:assembleDebug --console=plain
      - uses: actions/upload-artifact@v4
        with:
          name: countdown-debug-apk
          path: composeApp/build/outputs/apk/debug/*.apk
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-reports-android
          path: composeApp/build/reports/tests/

  ios:
    name: iOS framework, tests + simulator app
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Kotlin/Native tests on the iOS simulator
        run: ./gradlew :composeApp:iosSimulatorArm64Test --console=plain
      - name: Build iOS app for the simulator
        run: |
          xcodebuild -project iosApp/iosApp.xcodeproj -target iosApp \
            -configuration Debug -sdk iphonesimulator -arch arm64 \
            CODE_SIGNING_ALLOWED=NO build
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-reports-ios
          path: composeApp/build/reports/tests/
