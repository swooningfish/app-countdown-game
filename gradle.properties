kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx3072M
org.gradle.jvmargs=-Xmx4096M -Dfile.encoding=UTF-8
org.gradle.configuration-cache=true
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true

# App identity - used by Android and the in-app "About" section.
# CI overrides the version with VERSION_NAME / VERSION_CODE derived from git tags.
app.name=Countdown
app.versionName=0.1.0
app.versionCode=100000
app.androidId=com.xrmx.countdown_game
app.iosBundleId=com.xrmx.countdown-game
app.sourceUrl=https://github.com/swooningfish/app-countdown-game
