name: Android CI

on:
  push:
    branches: [main]
    tags:
      - "v*"
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Version scheme (keeps versionCode rising so each CI APK installs over the previous one):
      #   tag vX.Y.Z  -> versionName X.Y.Z, versionCode (X*10000 + Y*100 + Z) * 1000
      #   other build -> versionName <last tag>-main.<run number> (-pr.<n> / -dev.<n> off main),
      #                  versionCode = last tag's code + commits since that tag (capped at 999)
      #   pre-release tag vX.Y.Z-rcN -> versionCode (code of X.Y.Z) - 500; builds after it add
      #                  commits capped at 499, so they stay below the final vX.Y.Z
      # A main build is therefore above the tag it follows and below the next tag.
      - name: Derive version
        run: |
          set -euo pipefail
          code_for() {
            local MA MI PA
            IFS=. read -r MA MI PA _ <<< "${1}.0.0"
            MA=${MA:-0}; MI=${MI:-0}; PA=${PA:-0}
            echo $(( (10#$MA * 10000 + 10#$MI * 100 + 10#$PA) * 1000 ))
          }
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION_NAME="${GITHUB_REF_NAME#v}"
            VERSION_CODE=$(code_for "${VERSION_NAME%%-*}")
            if [[ "${VERSION_NAME}" == *-* ]]; then VERSION_CODE=$(( VERSION_CODE - 500 )); fi
          else
            LAST_TAG=$(git describe --tags --abbrev=0 --match 'v[0-9]*' 2>/dev/null || true)
            if [[ -n "${LAST_TAG}" ]]; then
              BASE="${LAST_TAG#v}"
              COMMITS=$(git rev-list --count "${LAST_TAG}..HEAD")
            else
              BASE="0.1.0"
              COMMITS=$(git rev-list --count HEAD)
            fi
            BASE_CODE=$(code_for "${BASE%%-*}")
            MAX_COMMITS=999
            if [[ "${BASE}" == *-* ]]; then
              # After a pre-release tag: stay between it and the final release.
              BASE_CODE=$(( BASE_CODE - 500 ))
              MAX_COMMITS=499
            fi
            BASE="${BASE%%-*}"
            if (( COMMITS > MAX_COMMITS )); then COMMITS=${MAX_COMMITS}; fi
            case "${GITHUB_REF}" in
              refs/heads/main) CHANNEL=main ;;
              refs/pull/*) CHANNEL=pr ;;
              *) CHANNEL=dev ;;
            esac
            VERSION_NAME="${BASE}-${CHANNEL}.${GITHUB_RUN_NUMBER}"
            VERSION_CODE=$(( BASE_CODE + COMMITS ))
          fi
          {
            echo "VERSION_NAME=${VERSION_NAME}"
            echo "VERSION_CODE=${VERSION_CODE}"
          } >> "$GITHUB_ENV"
          echo "Building ${GITHUB_REF} as versionName=${VERSION_NAME} versionCode=${VERSION_CODE}"

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Install Android SDK packages
        run: |
          set -euo pipefail
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | sort | tail -n1)
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"

      # Caches the Gradle user home (dependencies, wrapper, build cache) between runs;
      # org.gradle.caching=true in gradle.properties turns the build cache on.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Unit tests
        run: ./gradlew :composeApp:desktopTest :composeApp:testDebugUnitTest --console=plain

      - name: Lint
        run: ./gradlew :composeApp:lintDebug --console=plain

      # Optional stable signing key (README, "Signing key for CI"). Without the secret the build
      # is signed with the runner's throwaway debug key and won't install over earlier builds.
      - name: Decode signing keystore
        env:
          COUNTDOWN_KEYSTORE_BASE64: ${{ secrets.COUNTDOWN_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [[ -z "${COUNTDOWN_KEYSTORE_BASE64:-}" ]]; then
            echo "::warning::COUNTDOWN_KEYSTORE_BASE64 is not set; using a throwaway debug signing key."
            exit 0
          fi
          KEYSTORE="${RUNNER_TEMP}/countdown-signing.jks"
          printf '%s' "${COUNTDOWN_KEYSTORE_BASE64}" | base64 --decode > "${KEYSTORE}"
          echo "COUNTDOWN_KEYSTORE_PATH=${KEYSTORE}" >> "$GITHUB_ENV"

      - name: Assemble debug APK
        env:
          COUNTDOWN_KEYSTORE_PASSWORD: ${{ secrets.COUNTDOWN_KEYSTORE_PASSWORD }}
          COUNTDOWN_KEY_ALIAS: ${{ secrets.COUNTDOWN_KEY_ALIAS }}
          COUNTDOWN_KEY_PASSWORD: ${{ secrets.COUNTDOWN_KEY_PASSWORD }}
        run: ./gradlew :composeApp:assembleDebug --console=plain

      - name: Remove signing keystore
        if: always()
        run: rm -f "${RUNNER_TEMP}/countdown-signing.jks"

      - name: Upload test and lint reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: countdown-reports
          path: |
            **/build/reports/
            **/build/test-results/
          if-no-files-found: ignore

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: countdown-debug-apk
          path: composeApp/build/outputs/apk/debug/*.apk

      - name: Prepare rolling debug release asset
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        run: |
          set -euo pipefail
          mkdir -p release-assets
          cp composeApp/build/outputs/apk/debug/*.apk release-assets/countdown-debug.apk
          echo "RELEASE_DATE_UTC=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"

      - name: Publish rolling debug release
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        uses: softprops/action-gh-release@v3.0.4
        with:
          tag_name: debug-latest
          name: Countdown debug build (latest main)
          target_commitish: ${{ github.sha }}
          prerelease: true
          make_latest: false
          overwrite_files: true
          files: release-assets/countdown-debug.apk
          body: |
            Debug APK from `main` (version ${{ env.VERSION_NAME }}, code ${{ env.VERSION_CODE }}).

            - **Commit:** `${{ github.sha }}`
            - **Date (UTC):** ${{ env.RELEASE_DATE_UTC }}
            - **Actions run:** https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}

      - name: Prepare versioned release asset
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          mkdir -p release-assets
          cp composeApp/build/outputs/apk/debug/*.apk "release-assets/countdown-${GITHUB_REF_NAME}-debug.apk"

      - name: Publish versioned release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3.0.4
        with:
          tag_name: ${{ github.ref_name }}
          name: Countdown ${{ github.ref_name }}
          prerelease: false
          make_latest: true
          generate_release_notes: true
          files: release-assets/countdown-${{ github.ref_name }}-debug.apk
